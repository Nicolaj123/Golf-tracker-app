<!DOCTYPE html>
<html lang="es-AR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fairwise</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Ccircle cx='100' cy='82' r='52'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='100' cy='82' r='52' fill='none' stroke='%231B4332' stroke-width='9'/%3E%3Cg clip-path='url(%23c)' fill='%231B4332'%3E%3Ccircle cx='58' cy='45' r='5'/%3E%3Ccircle cx='70' cy='38' r='5'/%3E%3Ccircle cx='84' cy='34' r='5'/%3E%3Ccircle cx='50' cy='58' r='5.5'/%3E%3Ccircle cx='63' cy='52' r='5.5'/%3E%3Ccircle cx='77' cy='47' r='5.5'/%3E%3Ccircle cx='92' cy='45' r='5'/%3E%3Ccircle cx='47' cy='72' r='6'/%3E%3Ccircle cx='60' cy='67' r='6'/%3E%3Ccircle cx='74' cy='62' r='5.5'/%3E%3Ccircle cx='89' cy='59' r='5'/%3E%3Ccircle cx='103' cy='58' r='4.5'/%3E%3Ccircle cx='48' cy='86' r='6'/%3E%3Ccircle cx='62' cy='82' r='6'/%3E%3Ccircle cx='76' cy='78' r='5.5'/%3E%3Ccircle cx='91' cy='75' r='5'/%3E%3Ccircle cx='105' cy='74' r='4'/%3E%3Ccircle cx='52' cy='100' r='5.5'/%3E%3Ccircle cx='66' cy='97' r='5.5'/%3E%3Ccircle cx='80' cy='93' r='5'/%3E%3Ccircle cx='94' cy='91' r='4'/%3E%3Ccircle cx='59' cy='112' r='5'/%3E%3Ccircle cx='72' cy='110' r='4.5'/%3E%3Ccircle cx='85' cy='107' r='4'/%3E%3C/g%3E%3Cpath d='M75 130 L125 130 L118 148 L82 148 Z' fill='none' stroke='%231B4332' stroke-width='9' stroke-linejoin='round'/%3E%3Cline x1='100' y1='148' x2='100' y2='188' stroke='%231B4332' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/charts.css" />
</head>
<body>
  <!-- Pantalla de login/registro. app.js decide cuándo mostrarla vs. la app real. -->
  <div id="auth-gate" hidden></div>

  <div class="app-shell" id="app-shell" hidden>

    <!-- Fondo oscuro detrás del drawer en mobile -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar (desktop fijo / drawer en mobile, mismo contenido en los dos) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <svg class="brand-icon" viewBox="0 0 200 200" width="30" height="30" aria-hidden="true">
          <defs><clipPath id="bic-sidebar"><circle cx="100" cy="82" r="52"/></clipPath></defs>
          <circle cx="100" cy="82" r="52" fill="none" stroke="var(--color-accent)" stroke-width="9"/>
          <g clip-path="url(#bic-sidebar)" fill="var(--color-accent)">
            <circle cx="58" cy="45" r="5"/><circle cx="70" cy="38" r="5"/><circle cx="84" cy="34" r="5"/>
            <circle cx="50" cy="58" r="5.5"/><circle cx="63" cy="52" r="5.5"/><circle cx="77" cy="47" r="5.5"/><circle cx="92" cy="45" r="5"/>
            <circle cx="47" cy="72" r="6"/><circle cx="60" cy="67" r="6"/><circle cx="74" cy="62" r="5.5"/><circle cx="89" cy="59" r="5"/><circle cx="103" cy="58" r="4.5"/>
            <circle cx="48" cy="86" r="6"/><circle cx="62" cy="82" r="6"/><circle cx="76" cy="78" r="5.5"/><circle cx="91" cy="75" r="5"/><circle cx="105" cy="74" r="4"/>
            <circle cx="52" cy="100" r="5.5"/><circle cx="66" cy="97" r="5.5"/><circle cx="80" cy="93" r="5"/><circle cx="94" cy="91" r="4"/>
            <circle cx="59" cy="112" r="5"/><circle cx="72" cy="110" r="4.5"/><circle cx="85" cy="107" r="4"/>
          </g>
          <path d="M75 130 L125 130 L118 148 L82 148 Z" fill="none" stroke="var(--color-accent)" stroke-width="9" stroke-linejoin="round"/>
          <line x1="100" y1="148" x2="100" y2="188" stroke="var(--color-accent)" stroke-width="9" stroke-linecap="round"/>
        </svg>
        <span class="brand-word"><span class="brand-word-fair">FAIR</span><span class="brand-word-wise">WISE</span></span>
      </div>

      <nav id="sidebar-nav" aria-label="Navegación principal"></nav>

      <div class="sidebar__footer" id="sidebar-footer"></div>
    </aside>

    <!-- Área principal -->
    <div class="main">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap: var(--space-3);">
          <button class="btn btn--icon hamburger-btn" id="btn-hamburger" aria-label="Abrir menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <h1 class="topbar__title" id="topbar-title">Dashboard</h1>
        </div>
        <div class="topbar__actions">
          <!-- Espacio reservado para acciones contextuales por vista -->
        </div>
      </header>

      <main id="view-root" class="view" aria-live="polite"></main>
    </div>

  </div>

  <!--
    Scripts clásicos (NO type="module") a propósito: Chrome/Edge
    bloquean los ES Modules por CORS al abrir el archivo con doble
    clic (file://). Cada archivo se registra en el namespace global
    window.GT. El orden importa: core primero, módulos después, y
    app.js al final porque arma la navegación y hace boot().

    supabase.js está vendorizado localmente (assets/vendor) en vez
    de venir de un CDN, para no depender de la disponibilidad de un
    tercero en producción. Si config.js queda vacío, la app arranca
    en modo local (sin login) exactamente como en etapas anteriores.
  -->
  <script src="assets/vendor/supabase.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/db-schema.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/engine/training-engine.js"></script>
  <script src="js/engine/stats-engine.js"></script>
  <script src="js/engine/confidence.js"></script>
  <script src="js/backup/backup.js"></script>

  <script src="js/modules/auth-gate.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/entrenamiento-palos.js"></script>
  <script src="js/modules/rounds.js"></script>
  <script src="js/modules/course-mode.js"></script>
  <script src="js/modules/range-mode.js"></script>
  <script src="js/modules/bag.js"></script>
  <script src="js/modules/distances.js"></script>
  <script src="js/modules/goals.js"></script>
  <script src="js/modules/records.js"></script>
  <script src="js/modules/planner.js"></script>
  <script src="js/modules/settings.js"></script>

  <script src="js/core/app.js"></script>
</body>
</html>
